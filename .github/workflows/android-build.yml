name: Android Build

# Builds the Discnct debug APK in CI, where the Android SDK and Google's
# Maven repo are reachable (they are blocked in the dev sandbox this repo is
# worked on in, so this is the first environment that actually compiles the
# app). The APK is uploaded as an Actions artifact and also published to a
# rolling "debug" pre-release for a direct, phone-friendly download link.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21: game-logic pins a jvmToolchain(21); AGP 8.13 runs fine on it.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Pure-JVM game logic — the same 31 JUnit tests, run first as a fast gate.
      - name: Run game-logic unit tests
        run: ./gradlew -p game-logic test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: discnct-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Whether the upload keystore is in repo secrets, as a step output rather than a direct
      # `secrets.*` reference — GitHub Actions rejects secrets used straight inside an `if:`
      # condition, so the check has to happen in a run: step first.
      - name: Check for release signing secrets
        id: keystore_check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "present=$([ -n "$KEYSTORE_BASE64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Signed .aab for Play Console uploads (Internal Testing and beyond). Only runs once the
      # upload keystore is in repo secrets — until then this step, and only this step, is skipped,
      # so the debug build above keeps working with no keystore present.
      - name: Build signed release bundle
        if: steps.keystore_check.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > discnct-upload.jks
          {
            echo "storeFile=discnct-upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          ./gradlew :app:bundleRelease --stacktrace

      - name: Upload signed release bundle (Actions artifact)
        if: steps.keystore_check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: discnct-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Publish the APK to a single rolling "debug" pre-release so it has a
      # stable, direct download link that installs straight from a phone
      # browser — no GitHub login or zip-unpacking needed. Push builds only
      # (pull_request events from forks don't get a write-scoped token).
      - name: Publish APK to the rolling debug release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          cp "$APK" "discnct-debug-v0.1.0.apk"
          gh release create debug \
            --title "Discnct — debug build" \
            --notes "Latest debug APK, built from ${{ github.sha }}. Sideload onto an Android phone (see web-prototype for a no-install preview)." \
            --prerelease --target "${{ github.ref_name }}" 2>/dev/null || true
          gh release upload debug "discnct-debug-v0.1.0.apk" --clobber
