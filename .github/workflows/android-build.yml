name: Android Build

# Builds the Discnct debug APK in CI, where the Android SDK and Google's
# Maven repo are reachable (they are blocked in the dev sandbox this repo is
# worked on in, so this is the first environment that actually compiles the
# app). The APK is uploaded as an Actions artifact and also published to a
# rolling "debug" pre-release for a direct, phone-friendly download link.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21: game-logic pins a jvmToolchain(21); AGP 8.7 runs fine on it.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Pure-JVM game logic — the same 31 JUnit tests, run first as a fast gate.
      - name: Run game-logic unit tests
        run: ./gradlew -p game-logic test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: discnct-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publish the APK to a single rolling "debug" pre-release so it has a
      # stable, direct download link that installs straight from a phone
      # browser — no GitHub login or zip-unpacking needed. Push builds only
      # (pull_request events from forks don't get a write-scoped token).
      - name: Publish APK to the rolling debug release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          cp "$APK" "discnct-debug-v0.1.0.apk"
          gh release create debug \
            --title "Discnct — debug build" \
            --notes "Latest debug APK, built from ${{ github.sha }}. Sideload onto an Android phone (see web-prototype for a no-install preview)." \
            --prerelease --target "${{ github.ref_name }}" 2>/dev/null || true
          gh release upload debug "discnct-debug-v0.1.0.apk" --clobber
