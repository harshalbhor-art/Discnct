name: Android Build

# Builds the Discnct debug APK in CI, where the Android SDK and Google's
# Maven repo are reachable (they are blocked in the dev sandbox this repo is
# worked on in, so this is the first environment that actually compiles the
# app). The APK is uploaded as a downloadable artifact for sideloading.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21: game-logic pins a jvmToolchain(21); AGP 8.7 runs fine on it.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Pure-JVM game logic — the same 31 JUnit tests, run first as a fast gate.
      - name: Run game-logic unit tests
        run: ./gradlew -p game-logic test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: discnct-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
